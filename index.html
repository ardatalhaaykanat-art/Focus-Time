<!DOCTYPE html>
<html lang="en">
 <head><
<meta charset="UTF-8>
  <meta name="viewport"
   content="width=device-width,
   initial-scale=1.0">
   <title>Focus - Focus Room</title>
   <!-- Confetti Library -->
   <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"</script>
   <style>
   body {
   font-family:'Segoe UI', Tahoma,Geneva, Verdana, sans-serif;
   background-color: #ffffff;
   color: #000000;
   text-align: center;
   padding: 20px;
   margin: 0;
   }
   .container{
   max-width: 500px;
   margin: 20px auto;
   background: #ffffff;
   padding: 30px;
   border-radius: 20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    border: 1px solid #eaeaea;
    position: relative;
   }
    .control-group {
     display: flex;
     flex-direction:column;
     align-items: center;
    }
    .control-group label {
     font-size: 13px;
     font-weight: 600;
     color: #555;
     margin-bottom: 5px;
     }
    .btn-time {
     width: 30 px;
     height: 30px;
     font-size: 16px;
     font-weight:bold;
     border: none;
     background: #e2e8f0;
     color: #333;
     border-radius:6px;
     cursor: pointer ;
     margin:0 4px;
    }
    .time-val{
     font-weight:bold;
     font-size: 16px;
     min-width: 24px;
     display:inline-block;
    }
    #error-msg {
     color:#fc2626;
     font-weight:600;
     font-size:13px;
     min-height:20px;
     margin-bottom:5px;
    }
    #timer{
     font-size:70px;
     font-weight:800;
     margin: 10px 0;
     color: #000000;
     letter-spacing:2px;
    }
    .blink{
     animation: blinker 0.6s linear infinite;
    }
    @keyframes blinker {
     50% { opacity: 0;}
    }
    img{
     width: 280px;
     height: 190px;
     object-fit:cover
    }
   </style>
